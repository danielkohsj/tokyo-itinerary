function places(){return `<div class="pagehead"><div><div class="kicker">${days.reduce((n,d)=>n+d.items.length,0)} ${t('count')}</div><h2>${t('allPlaces')}</h2><p class="sub">${t('placesSub')}</p></div></div><div class="placesTools"><input type="search" class="search" id="search" value="${esc(query)}" aria-label="${t('search')}" placeholder="${t('search')}"><select id="dayFilter" aria-label="${t('date')}"><option value="all">${t('allDays')}</option>${days.map((d,i)=>`<option value="${i}" ${String(dayFilter)===String(i)?'selected':''}>${date(d)}</option>`).join('')}</select><select id="typeFilter" aria-label="${t('allKinds')}"><option value="all">${t('allKinds')}</option>${['food','shop','sight','nature','flight'].map(k=>`<option value="${k}" ${typeFilter===k?'selected':''}>${t(k)}</option>`).join('')}</select></div><div class="legend"><label class="filtercheck"><input type="checkbox" id="coreOnly" ${coreOnly?'checked':''}>${t('coreOnly')}</label><label class="filtercheck"><input type="checkbox" id="savedOnly" ${savedOnly?'checked':''}>${t('savedOnly')}</label><span id="resultCount" aria-live="polite"></span></div><div class="placeList" id="results"></div>`}

TASKS.forEach((v,i)=>{v[1].cn=["2026年12月24日 · 13:00 马来西亚时间", "2027年2月6日 · 23:00 马来西亚时间", "出发前", "约出发前两周", "出发前", "镰仓之前", "回程前"][i];v[2].cn=["购买2月24日迪士尼门票，按当前提前两个月开售规则。", "尝试购买2月21日16:20的Shibuya Sky门票，日本时间2月7日00:00开售。", "预订富士山团，确认浅草接送、路线、送达地点与取消期限。", "填写 Visit Japan Web。", "确认 Bincho 分店，有开放预约便预订晚餐。", "询问 Espresso D Works 所需菜品几点开始供应。", "确认13:00–13:30前到机场的班次、退税流程及行李限制。"][i]});
function info(){return `<div class="pagehead"><div><div class="kicker">20–28 FEB 2027</div><h2>${t('travelTitle')}</h2><p class="sub">${t('travelSub')}</p></div></div><div class="infoColumns"><div><section class="infoSection"><h3>${t('flights')}</h3><div class="flight"><span>20 FEB</span><div>ZG62 · KUL → NRT<small>${t('outbound')}</small></div><span class="mono flightTime">01:10 → 09:00</span></div><div class="flight"><span>28 FEB</span><div>ZG61 · NRT → KUL<small>${t('homeward')}</small></div><span class="mono flightTime">16:50 → 23:40</span></div><p class="notice">${t('flightNote')}</p></section><section class="infoSection"><h3>${t('hotel')}</h3><p><strong style="color:var(--ink)">${t('baseValue')}</strong><br>1-12-16 Komagata, Taito City, Tokyo 111-0043</p><p>${t('hotelNote')}</p><a class="button" style="margin-top:15px" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=APA+Hotel+Asakusa+Ekimae">${t('map')} ↗</a></section><section class="infoSection"><h3>${t('notes')}</h3><textarea id="notes" aria-label="${t('notes')}" placeholder="${t('notesPlaceholder')}">${esc(notes)}</textarea><p class="caption" id="noteStatus">${t('notesSaved')}</p></section></div><div><section class="infoSection"><h3>${t('checklist')}</h3>${TASKS.map(([id,when,label])=>`<div class="checkrow"><input type="checkbox" id="check-${id}" data-check="${id}" ${checks[id]?'checked':''}><label for="check-${id}">${esc(L(label))}<small>${esc(L(when))}</small></label></div>`).join('')}<p class="notice">${t('checkNote')}</p></section></div></div><section class="infoSection"><h3>${t('ruleTitle')}</h3><p>${t('ruleNote')}</p><p>${t('taxNote')}</p></section><section class="infoSection"><h3>${t('linkTitle')}</h3><div class="controls">${[['Disneyland','東京ディズニーランド','https://www.tokyodisneyresort.jp/en/tdl/daily/calendar/20270224/'],['Shibuya Sky','SHIBUYA SKY','https://www.shibuya-scramble-square.com/sky/'],['Fuji tour','富士山ツアー','https://www.klook.com/en-US/activity/193205-mount-fuji-full-day-small-group-experience-with-pick-up/'],['Visit Japan Web','Visit Japan Web','https://www.vjw.digital.go.jp/'],['Tax-refund procedure','税金を返してもらう方法','https://www.mlit.go.jp/kankocho/tax-free/page01_000001_00028.html']].map(([en,ja,url])=>`<a class="button" href="${url}" target="_blank" rel="noopener noreferrer">${language==='ja'?ja:language==='cn'?({'Disneyland':'东京迪士尼乐园','Shibuya Sky':'Shibuya Sky','Fuji tour':'富士山一日游','Visit Japan Web':'Visit Japan Web','Tax-refund procedure':'退税流程'}[en]||en):en} ↗</a>`).join('')}</div></section><p class="caption">${t('languageNote')}</p>`}
function render(){nav();$('content').innerHTML=({home,days:daily,places,info}[view])();if(view==='places')placeResults();if(view==='days'){let strip=document.querySelector('.dates'),active=strip?.querySelector('.active');if(strip&&active)strip.scrollLeft=active.offsetLeft-strip.offsetLeft-30}}
function go(v,i){view=v;if(i!==undefined){selected=Math.max(0,Math.min(8,i));subview='schedule'}history.replaceState(null,'',v==='days'?'#day='+days[selected].date:'#'+v);render();window.scrollTo({top:0,behavior:'instant'})}
function printAll(){document.body.classList.add('printing');$('content').innerHTML=`<div class="printHeader"><h2>${t('planTitle')}</h2><p>${t('japanTime')} · JST / UTC+9</p></div>${method()}${overview()}${days.map((d,i)=>`<section class="printDay">${dayBody(d,i,true)}${sourcePanel(d,true)}</section>`).join('')}`;window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');render()},{once:true});window.print()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-view],[data-day],[data-lang],[data-subview],[data-stop],[data-save],[data-print]');if(!b||b.disabled)return;if(b.dataset.lang){language=b.dataset.lang;persist('tokyo-language',language);render()}else if(b.dataset.view){e.preventDefault();go(b.dataset.view)}else if(b.dataset.day!==undefined)go('days',Number(b.dataset.day));else if(b.dataset.subview){subview=b.dataset.subview;render()}else if(b.dataset.stop){subview='places';showOptional=true;render();let el=$(b.dataset.stop);el?.scrollIntoView({block:'center',behavior:'instant'});el?.focus({preventScroll:true})}else if(b.dataset.save){let id=b.dataset.save;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist('tokyo-hearts',JSON.stringify(saved));if(view==='places')placeResults();else{b.classList.toggle('saved',saved.includes(id));b.textContent=saved.includes(id)?t('saved'):t('save');b.setAttribute('aria-pressed',String(saved.includes(id)))}}else if(b.hasAttribute('data-print'))printAll()});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;placeResults()}if(e.target.id==='notes'){notes=e.target.value;$('noteStatus').textContent=persist('tokyo-notes',notes)?t('notesSaved'):t('storageError')}});document.addEventListener('change',e=>{const id=e.target.id;if(id==='dayFilter'){dayFilter=e.target.value;placeResults()}if(id==='typeFilter'){typeFilter=e.target.value;placeResults()}if(id==='coreOnly'){coreOnly=e.target.checked;placeResults()}if(id==='savedOnly'){savedOnly=e.target.checked;placeResults()}if(id==='showOptional'){showOptional=e.target.checked;render()}if(e.target.dataset.check){checks[e.target.dataset.check]=e.target.checked;persist('tokyo-checks',JSON.stringify(checks))}});window.addEventListener('hashchange',()=>{readHash();render()});render();
</script></body></html>
